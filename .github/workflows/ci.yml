# CI (docs/14-deployment.md §3): quality gates on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invitoverse_ci
  DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/invitoverse_ci
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invitoverse_test
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  LAUNCH_ALL_FREE: "true"
  CRON_SECRET: ci-cron-secret

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invitoverse_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE invitoverse_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm audit --audit-level high
      - name: Unit + integration tests
        run: pnpm test
      - name: Migrate + seed
        run: pnpm db:deploy && pnpm db:seed
      - name: Production build + JS budgets
        run: pnpm build && node scripts/bundle-report.mjs .next
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E against the production build
        run: |
          pnpm start --port 3000 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3000 E2E_PROD=1 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
